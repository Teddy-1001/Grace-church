<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/assets/css/output.css" rel="stylesheet">
    <link rel="shortcut icon" href="/src/assets/images/ack-logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Sermons</title>
</head>

<body>
    <div class="" id="header-placeholder"></div>
    <section class="relative min-h-[84vh] flex items-center">

        <!-- Background image -->
        <div class="fixed inset-0 -z-10">
            <img src="../assets/images/2019-06-02.jpg" class="w-full h-full object-cover scale-110"
                alt="Grace Church Sermons">
        </div>

        <!-- Dark overlay -->
        <div class="absolute inset-0 bg-gradient-to-r from-black/70 via-black/60 to-black/40"></div>

        <!-- Content -->
        <div class="relative z-10 max-w-7xl mx-auto px-6 w-full">

            <div class="text-white max-w-xl">
                <button class="border rounded-full px-2">
                    Fellowship
                </button>

                <h2 class="text-4xl md:text-6xl font-bold leading-tight">
                    Our Estates Fellowships
                </h2>

                <p class="mt-3 text-white/80 text-lg md:text-xl">
                    Our estate fellowships bring the church to your neighbourhood. Find your local group and join a
                    community rooted in prayer, worship, and mutual care.
                </p>

                <!-- optional CTA -->
                <div class="mt-6 flex gap-4">
                    <a href="#"
                        class="bg-white text-black px-5 py-3 rounded-xl font-semibold hover:scale-105 transition">
                        Watch Now
                    </a>

                    <a href="#all-fellowships"
                        class="border border-white/40 text-white px-5 py-3 rounded-xl hover:bg-white/10 transition">
                        Browse All
                    </a>
                </div>

            </div>

        </div>

    </section>
    <section class="bg-gray-50 py-20" id="all-fellowships">
        <div class="max-w-7xl mx-auto px-6">
            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900">
                    Estate Fellowships
                </h1>
                <p class="text-gray-600 mt-3">
                    Learn, listen, and grow through our eastate fellowships
                </p>
            </div>
            <!-- Grid -->
            <div id="fellowship-container" class="grid gap-8 grid-cols-1 sm:grid-cols-2 md:grid-cols-3">
                <!-- rendered by js -->
            </div>
        </div>
    </section>
    <!-- footer -->
    <div id="footer-placeholder"></div>
    <script src="/src/assets/js/index.js" defer></script>
    <script src="/src/assets/js/fellowship.js" defer></script>
</body>

</html>
